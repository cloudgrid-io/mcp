<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in to CloudGrid</title>
<style>:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-sans, Inter, system-ui, -apple-system, sans-serif);
  background: transparent;
  color: light-dark(#0d0d0f, #fafafa);
}
#card {
  max-width: 420px;
  margin: 0 auto;
  padding: 1.5rem;
}
h1 {
  font-size: 1.15rem;
  margin: 0 0 0.5rem;
}
.lede {
  margin: 0 0 1rem;
  font-size: 0.9rem;
  line-height: 1.45;
  opacity: 0.85;
}
.status {
  margin: 0 0 1rem;
  font-size: 0.85rem;
  opacity: 0.7;
  min-height: 1.2em;
}
.actions {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
button {
  font: inherit;
  font-weight: 600;
  padding: 0.6rem 1.1rem;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
  background: light-dark(#0d0d0f, #fafafa);
  color: light-dark(#fafafa, #0d0d0f);
}
button:disabled { opacity: 0.5; cursor: default; }
button.secondary {
  background: transparent;
  color: inherit;
  border-color: light-dark(rgba(13,13,15,0.25), rgba(250,250,250,0.3));
}
.fallback {
  margin: 1rem 0 0;
  font-size: 0.8rem;
  opacity: 0.7;
  word-break: break-all;
}
.fallback a { color: inherit; }</style>
</head>
<body>
<main id="card">
  <h1>Sign in to CloudGrid</h1>
  <p class="lede">CloudGrid runs your apps with the infrastructure they need. Sign in to plug to your grid.</p>
  <p class="status" id="status">Preparing the sign-in link.</p>
  <div class="actions">
    <button id="signin" type="button" disabled>Open sign-in</button>
    <button id="check" type="button" class="secondary" hidden>Check sign-in</button>
  </div>
  <p class="fallback" id="fallback" hidden>
    Or open this link yourself:
    <a id="fallback-url" href="#" target="_blank" rel="noopener noreferrer"></a>
  </p>
</main>
