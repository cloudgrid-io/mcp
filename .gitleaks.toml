# gitleaks config for cloudgrid-io/mcp.
#
# Keep ALL default gitleaks rules in force everywhere, and allowlist only the
# files that intentionally contain credential-SHAPED strings as part of the
# secret-scrubber test suites:
#   - test/session-logger.test.mjs — planted fake secrets (Stripe/GitHub/AWS/GCP/
#     Slack/JWT/PEM/basic-auth) that PROVE the scrubber redacts them. None are real.
#   - src/session-logger.js — the scrubber's credential-shape regex literals
#     (e.g. the "-----BEGIN … PRIVATE KEY-----" PEM header pattern).
#   - test/error-reporting.test.mjs — planted fake secrets (OpenAI/Anthropic/AWS/
#     GitHub/Stripe/Bearer) that PROVE scrubReportContext value-scrubbing works.
#
# Scoped to these paths only; the rest of the repo is scanned normally.
[extend]
useDefault = true

[allowlist]
description = "Secret-scrubber test suites: intentional credential-shaped test fixtures + regex literals (no real secrets)."
paths = [
  '''test/session-logger\.test\.mjs''',
  '''test/error-reporting\.test\.mjs''',
  '''src/session-logger\.js''',
]
