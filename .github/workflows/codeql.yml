name: CodeQL

# Static analysis, committed as advanced setup rather than GitHub's default
# setup, so turning it off is a reviewed diff instead of a silent settings
# change. Runs on every PR to main, on every push to main, and weekly, so a
# quiet repo still gets re-analysed when the query packs change.
#
# Query suite: security-extended (the default suite plus lower-precision
# security queries). build-mode none: every language here is interpreted,
# so nothing is compiled and no build step is needed.
#
# RUNNER: GitHub-hosted. This repository is public, so hosted minutes are free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '5 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
