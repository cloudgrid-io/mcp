name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for the founder's approval before publishing (#439). The `npm`
    # environment has a required reviewer and accepts only `v*` tags.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships 10.9.8.
      # Pinned (not npm@latest) so the version is reproducible and a tag-triggered
      # release can't be surprised by a new npm major on an immutable tag.
      - run: npm install -g npm@11.19.0
      - run: npm ci
      - run: npm run smoke
      # No stored token: publish authenticates via the workflow's OIDC identity
      # (trusted publisher). --provenance is kept so the run fails rather than
      # publishing without provenance if attestation can't be generated.
      - run: npm publish --provenance --access public
      - name: Build .mcpb desktop extension
        run: npm run build:mcpb
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes cloudgrid.mcpb
      # #494: publish server.json to the official MCP Registry. GitHub OIDC
      # proves the run belongs to cloudgrid-io, so no token is stored. The
      # publisher is pinned by version and checksum. server.json's version
      # already matches package.json (test:registry-server-json in CI).
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: "1.8.7"
          MCP_PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
